name: osc-adv-870-alloc-guard

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Commit, branch, or tag to test
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: linux / ${{ matrix.cc }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nitjsefnie-osc/eigenscript-dev:ci-main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ inputs.target_ref }}"
      - name: Build
        run: CC=${{ matrix.cc }} ./build.sh
      - name: Verify binary
        run: ./src/eigenscript --version
      - name: Run test suite
        run: cd tests && bash run_all_tests.sh
